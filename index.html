<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utilitor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Utilitor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#081519">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"samudra"}catch(e){document.documentElement.dataset.theme="samudra"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.2,.8,.2,1);--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
html[data-theme=samudra]{--bg:#081519;--bg2:#0e2229;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.1);--ink:#e9f2f3;--mute:#8da9b0;--line:rgba(255,255,255,.12);--p:#5fd0cb;--p-bg:rgba(95,208,203,.14);--a:#f0b866;--a-bg:rgba(240,184,102,.15);--danger:#ff8a80;--on:#06161a;--orb:.34;--shadow:0 12px 40px rgba(0,0,0,.35);color-scheme:dark}
html[data-theme=gading]{--bg:#f4eee2;--bg2:#fbf8f2;--card:rgba(255,255,255,.72);--card2:#fff;--ink:#1c2b2f;--mute:#667a80;--line:rgba(28,43,47,.13);--p:#0e6b6b;--p-bg:rgba(14,107,107,.1);--a:#a8620f;--a-bg:rgba(168,98,15,.11);--danger:#b3261e;--on:#fff;--orb:.17;--shadow:0 12px 32px rgba(60,50,30,.13);color-scheme:light}
html[data-theme=senja]{--bg:#120e1c;--bg2:#1c1632;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.1);--ink:#f0ebf8;--mute:#a699bf;--line:rgba(255,255,255,.12);--p:#b79cff;--p-bg:rgba(183,156,255,.15);--a:#ffb878;--a-bg:rgba(255,184,120,.15);--danger:#ff8fa3;--on:#140d24;--orb:.34;--shadow:0 12px 40px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
small{color:var(--mute);font-weight:400}

/* latar bergerak */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg))}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--orb);will-change:transform}
.o1{width:46vmax;height:46vmax;background:var(--p);top:-18vmax;left:-12vmax;animation:d1 28s ease-in-out infinite alternate}
.o2{width:40vmax;height:40vmax;background:var(--a);bottom:-16vmax;right:-10vmax;opacity:calc(var(--orb)*.65);animation:d2 34s ease-in-out infinite alternate}
.o3{width:28vmax;height:28vmax;background:var(--p);top:35%;right:18%;opacity:calc(var(--orb)*.4);animation:d3 40s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vw,-12vh) scale(1.2)}}
@keyframes d3{to{transform:translate(-22vw,10vh) scale(.8)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes fade{from{opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes sheen{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}

/* tombol & input */
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 13px;transition:background .2s,transform .2s var(--ease),border-color .2s,box-shadow .2s}
button:hover{background:var(--card2);transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.98)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--p);outline-offset:2px}
button:disabled{opacity:.55;cursor:wait;transform:none}
button.main{position:relative;overflow:hidden;border:0;font-weight:600;color:var(--on);background:var(--p);background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 55%,var(--a)));box-shadow:0 6px 22px -6px var(--p)}
button.main:hover{box-shadow:0 10px 28px -6px var(--p)}
button.main::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite}
button.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px}
.del{color:var(--danger)}
input,textarea{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px var(--p-bg);outline:0}
textarea{min-height:104px;resize:vertical}
::placeholder{color:var(--mute)}

/* splash & login */
#splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
.ring{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--p);animation:spin .8s linear infinite}
#login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.lcard{width:min(380px,100%);display:grid;gap:12px;padding:30px 26px;border:1px solid var(--line);border-radius:24px;background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow);animation:rise .7s var(--ease) backwards}
.lcard>*{animation:rise .7s var(--ease) backwards}
.lcard>:nth-child(2){animation-delay:.08s}.lcard>:nth-child(3){animation-delay:.14s}.lcard>:nth-child(4){animation-delay:.2s}.lcard>:nth-child(5){animation-delay:.26s}.lcard>:nth-child(6){animation-delay:.32s}
.logo{width:64px;height:64px;border-radius:18px;margin:0 auto;display:block;animation:float 5s ease-in-out infinite;box-shadow:0 10px 30px -8px var(--p)}
.lcard h1{text-align:center;font-size:30px}
.lcard p{margin:0;text-align:center;color:var(--mute);font-size:14px}
#lerr{color:var(--danger);font-size:14px;text-align:center;min-height:20px}
.themes{display:flex;gap:8px;justify-content:center;align-items:center}
.themes button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--line)}
.themes button.on{border-color:var(--ink);transform:scale(1.15)}
.themes [data-th=samudra]{background:linear-gradient(135deg,#0e2229 50%,#5fd0cb 50%)}
.themes [data-th=gading]{background:linear-gradient(135deg,#f4eee2 50%,#0e6b6b 50%)}
.themes [data-th=senja]{background:linear-gradient(135deg,#1c1632 50%,#b79cff 50%)}

/* aplikasi */
#app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100dvh;animation:fade .6s}
#side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:14px;padding:18px 14px;border-right:1px solid var(--line);background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:34px;height:34px;border-radius:10px}
.brand h1{font-size:21px;line-height:1.1}
#chats{flex:1;overflow:auto;display:grid;gap:4px;align-content:start;margin:0 -4px;padding:0 4px}
.citem{display:grid;gap:1px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:transparent}
.citem:hover{background:var(--card2);transform:none}
.citem.on{background:var(--p-bg);box-shadow:inset 3px 0 0 var(--p)}
.ct{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfoot{display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
#scrim{display:none}
#chatview{min-width:0}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:linear-gradient(var(--bg),transparent)}
header h2{flex:1;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu{display:none}
main{max-width:780px;margin:auto;padding:4px 18px 48px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:12px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:border-color .25s,box-shadow .25s}
.box.drag{border-color:var(--p);box-shadow:0 0 0 4px var(--p-bg),var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.seg{display:flex;gap:0}
.seg button{border-radius:0}.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0;border-left:0}
.seg .on[data-t=prompt]{background:var(--p);color:var(--on);border-color:var(--p)}
.seg .on[data-t=answer]{background:var(--a);color:var(--on);border-color:var(--a)}
#prev{max-width:100%;max-height:220px;border-radius:12px;display:none;cursor:pointer;animation:rise .4s var(--ease)}
#st{color:var(--mute);font-size:14px;min-height:20px}
.msg{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px;position:relative;overflow:hidden;animation:rise .55s var(--ease) backwards;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.msg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--p)}
.msg.answer::before{background:var(--a)}
.msg:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.tag{padding:2px 10px;border-radius:99px;font-weight:600;background:var(--p-bg);color:var(--p)}
.answer .tag{background:var(--a-bg);color:var(--a)}
.txt{white-space:pre-wrap;word-break:break-word}
.pic{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.pic.loading{display:block;width:100%;height:160px;border:0;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.msg .row button{padding:6px 11px;font-size:14px}
.empty{text-align:center;color:var(--mute);margin-top:56px;animation:fade .8s}

/* editor gambar */
.seg .on[data-f]{background:var(--p);color:var(--on);border-color:var(--p)}
#ed{position:fixed;inset:0;z-index:60;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);animation:fade .25s}
.edbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.edbar h2{flex:1;font-size:19px}
#edstage{min-height:0;display:grid;place-items:center;padding:12px;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--bg2)}
#edwrap{position:relative;display:grid;overflow:hidden;border-radius:6px;box-shadow:var(--shadow)}
#edcv{display:block}
#edsel{position:absolute;border:2px solid var(--p);box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none}
#edsel i{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--p);border:2px solid var(--on)}
#edsel i:nth-child(1){left:-8px;top:-8px}#edsel i:nth-child(2){right:-8px;top:-8px}#edsel i:nth-child(3){left:-8px;bottom:-8px}#edsel i:nth-child(4){right:-8px;bottom:-8px}
.edtools{display:grid;gap:10px;padding:12px 14px;border-top:1px solid var(--line);max-height:46dvh;overflow:auto}
.edhint,#edst{font-size:13px;color:var(--mute)}
.edsl{display:flex;align-items:center;gap:8px;flex:1;min-width:160px;font-size:14px;color:var(--mute)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--p)}
#edtxt{min-height:72px}

/* tampilan format pesan */
.md{min-width:0;word-break:break-word}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:.55em 0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{font-family:inherit;font-weight:700;line-height:1.3;margin:1em 0 .4em}
.md h1{font-size:1.35em}.md h2{font-size:1.22em}.md h3{font-size:1.1em}.md h4,.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:.5em 0;padding-left:1.4em}.md li{margin:.2em 0}.md li>ul,.md li>ol{margin:.2em 0}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.9em;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:.08em .35em}
.cb{margin:.7em 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.cbar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;font-size:12px;color:var(--mute);border-bottom:1px solid var(--line)}
.cbar button{padding:3px 10px;font-size:12px}
.cb pre{margin:0;padding:12px;overflow-x:auto}
.cb code{background:none;border:0;padding:0;font-size:13px;line-height:1.5;white-space:pre}
.md blockquote{margin:.6em 0;padding:.1em 0 .1em 12px;border-left:3px solid var(--p);color:var(--mute)}
.md hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.tw{overflow-x:auto;margin:.6em 0}
.md table{border-collapse:collapse;font-size:.95em}
.md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:var(--card2)}
.md a{color:var(--p)}
/* ===== tampilan kompak ===== */
body{font-size:14px;line-height:1.45}
button{padding:5px 10px;font-size:13px;border-radius:8px}
button svg{width:14px;height:14px;vertical-align:-2px}
button.icon{width:30px;height:30px;font-size:15px}
input,textarea{padding:7px 10px;border-radius:9px;font-size:14px}
textarea{min-height:68px}
#app{grid-template-columns:220px minmax(0,1fr)}
#side{padding:12px 10px;gap:10px}
.brand img{width:28px;height:28px;border-radius:8px}.brand h1{font-size:18px}
.citem{padding:6px 10px;border-radius:9px}.cp{font-size:12px}.ct{font-size:13.5px}
.sfoot{gap:8px;padding-top:8px}
#chatview{height:100dvh;display:flex;flex-direction:column}
header{position:static;flex:none;padding:7px 12px;background:none}
header h2{font-size:17px}
main{flex:1;min-height:0;overflow:auto;width:100%;max-width:1200px;margin:0 auto;padding:2px 12px 12px;display:flex;flex-direction:column;gap:8px}
.box{flex:none;padding:8px;gap:6px;border-radius:14px}
.row{gap:6px}
#st{font-size:12.5px;min-height:0;color:var(--mute)}#st:empty{display:none}
.tawrap{position:relative}
.tawrap textarea{display:block;padding-right:72px}
.tabtns{position:absolute;top:4px;right:5px;display:flex;gap:2px}
.prow{display:flex;gap:8px;align-items:flex-start}
#prev{max-height:84px;max-width:min(180px,60%);object-fit:contain;border-radius:8px;margin:0}
.pacts{display:flex;gap:2px;flex-wrap:wrap}
.ib{width:26px;height:26px;padding:0;display:inline-grid;place-items:center;border-radius:7px;background:transparent;border-color:transparent;color:var(--mute)}
.ib:hover{background:var(--card2);color:var(--ink);border-color:var(--line);transform:none}
.ib svg{width:15px;height:15px;vertical-align:0}
.ib.on{color:var(--p);background:var(--p-bg)}
.ib.del{color:var(--mute)}.ib.del:hover{color:var(--danger)}
.ib:disabled{opacity:.4}
.empty{margin-top:24px}
/* daftar pesan: dua kolom */
#list{flex:1;min-height:260px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:8px}
.mcol{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
#colL{overflow:hidden}#colL.sc{overflow-y:auto}
#colR{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding-right:2px}
.msg{flex:none;margin:0;padding:7px 10px 8px 12px;border-radius:12px;gap:5px}
.msg::before{width:3px}
.msg:hover{transform:none;box-shadow:none;border-color:color-mix(in srgb,var(--p) 40%,var(--line))}
.meta{font-size:11.5px;gap:6px}
.tag{padding:1px 8px;font-size:11px}
.acts{margin-left:auto;display:flex;gap:1px}
.pic{max-height:190px;object-fit:contain;cursor:zoom-in;border-radius:8px}
.pic.big{max-height:none;cursor:zoom-out}
.pic.loading{height:90px}
.md h1{font-size:1.25em}.md h2{font-size:1.15em}.md h3{font-size:1.06em}
.cb code{font-size:12px}
.cbar{padding:2px 4px 2px 10px;font-size:11px}
/* editor */
.seg .on[data-m]{background:var(--p);color:var(--on);border-color:var(--p)}
.edbar{padding:8px 12px}.edbar h2{font-size:16px}
#edstage{padding:8px}
.edtools{gap:7px;padding:9px 12px}
.edtools .ib{border-color:var(--line);background:var(--card);width:30px;height:30px}
.edhint{font-size:12px;line-height:1.35}
#edtxt{min-height:60px}
#edmarks{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;border:2px solid #e5322d;background:rgba(229,50,45,.12);border-radius:2px}
.mk[data-n]::before{content:attr(data-n);position:absolute;left:-2px;top:-2px;min-width:17px;height:17px;padding:0 4px;background:#e5322d;color:#fff;font:700 11px/17px var(--sans);text-align:center;border-radius:2px 0 6px 0}
.mk.act{border-width:3px;background:rgba(229,50,45,.18)}
.mk i{position:absolute;width:13px;height:13px;border-radius:50%;background:#e5322d;border:2px solid #fff}
.mk i:nth-child(1){left:-8px;top:-8px}.mk i:nth-child(2){right:-8px;top:-8px}.mk i:nth-child(3){left:-8px;bottom:-8px}.mk i:nth-child(4){right:-8px;bottom:-8px}
@media(max-width:759px){
  #list{display:block;flex:none;min-height:0}
  .mcol{display:block}
  #colL,#colR{overflow:visible;padding:0}
  .msg{margin-bottom:6px}
}
@media (hover:hover) and (pointer:fine){#paste{display:none}}

@media(max-width:820px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;z-index:30;inset:0 auto 0 0;width:min(84vw,310px);background:var(--bg2);transform:translateX(-104%);transition:transform .38s var(--ease);box-shadow:var(--shadow)}
  #app.open #side{transform:none}
  #scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
  #app.open #scrim{opacity:1;pointer-events:auto}
  #menu{display:grid}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<div id="splash"><div class="ring"></div></div>

<section id="login" hidden>
  <div class="lcard">
    <img class="logo" src="favicon.svg" alt="">
    <h1>Utilitor</h1>
    <p>Pertukaran data antar perangkat, pribadi dan rapi.</p>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password">
    <button class="main" id="go">Masuk</button>
    <div id="lerr" role="alert"></div>
    <div class="themes" role="group" aria-label="Tema"><button data-th="samudra" aria-label="Tema Samudra"></button><button data-th="gading" aria-label="Tema Gading"></button><button data-th="senja" aria-label="Tema Senja"></button></div>
    <p><small class="ver"></small></p>
  </div>
</section>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><img src="favicon.svg" alt=""><h1>Utilitor <small class="ver"></small></h1></div>
    <button class="main" id="newchat">＋ Chat baru</button>
    <nav id="chats" aria-label="Daftar chat"></nav>

/* ---------- pengolahan gambar (murni, bisa diuji tanpa browser) ---------- */
/*PURE-START*/
const dims = s => [s.naturalWidth || s.width, s.naturalHeight || s.height];
const rad = (w, h) => Math.max(1, Math.round(Math.max(w, h) / 1000));   // radius ikut resolusi
function boxBlur(a, w, h, r){
  const t = new Float32Array(w * h), o = new Uint8ClampedArray(w * h), n = 2 * r + 1;
  for (let y = 0; y < h; y++) {
    const row = y * w; let s = 0;
    for (let x = -r; x <= r; x++) s += a[row + Math.min(w - 1, Math.max(0, x))];
    for (let x = 0; x < w; x++) { t[row + x] = s / n; s += a[row + Math.min(w - 1, x + r + 1)] - a[row + Math.max(0, x - r)]; }
  }
  for (let x = 0; x < w; x++) {
    let s = 0;
    for (let y = -r; y <= r; y++) s += t[Math.min(h - 1, Math.max(0, y)) * w + x];
    for (let y = 0; y < h; y++) { o[y * w + x] = s / n; s += t[Math.min(h - 1, y + r + 1) * w + x] - t[Math.max(0, y - r) * w + x]; }
  }
  return o;
}
function stretchLut(g){            // regangkan kontras: 1% tergelap -> hitam, 1% tercerah -> putih
  const hist = new Uint32Array(256), n = g.length, L = new Uint8Array(256);
  for (let i = 0; i < n; i++) hist[g[i]]++;
  let c = 0, lo = 0, hi = 255;
  while (lo < 255 && (c += hist[lo]) < n * .01) lo++;
  c = 0; while (hi > 0 && (c += hist[hi]) < n * .01) hi--;
  if (hi - lo < 8) { lo = 0; hi = 255; }
  for (let v = 0; v < 256; v++) L[v] = Math.max(0, Math.min(255, (v - lo) * 255 / (hi - lo)));
  return L;
}
function adaptiveBin(g, w, h){     // hitam-putih adaptif (tahan cahaya tidak merata)
  const W = w + 1, I = new Uint32Array(W * (h + 1)), o = new Uint8ClampedArray(w * h);
  for (let y = 0; y < h; y++) { let row = 0; for (let x = 0; x < w; x++) { row += g[y * w + x]; I[(y + 1) * W + x + 1] = I[y * W + x + 1] + row; } }
  const hs = Math.max(8, Math.round(Math.min(w, h) / 12) >> 1);
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y - hs), y1 = Math.min(h, y + hs + 1);
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - hs), x1 = Math.min(w, x + hs + 1);
      const sum = I[y1 * W + x1] - I[y0 * W + x1] - I[y1 * W + x0] + I[y0 * W + x0], cnt = (x1 - x0) * (y1 - y0);
      o[y * w + x] = g[y * w + x] * cnt < sum * .9 ? 0 : 255;
    }
  }
  return o;
}
function grayPipeline(d, w, h, amt, bin){   // RGBA -> abu-abu, kontras, balik jika latar gelap, tajamkan, (opsional) hitam-putih
  const n = w * h, g = new Uint8ClampedArray(n);
  for (let i = 0, j = 0; j < n; i += 4, j++) g[j] = (d[i] * 77 + d[i + 1] * 151 + d[i + 2] * 28) >> 8;
  const L = stretchLut(g); let sum = 0;
  for (let j = 0; j < n; j++) { g[j] = L[g[j]]; sum += g[j]; }
  if (sum / n < 115) for (let j = 0; j < n; j++) g[j] = 255 - g[j];      // tulisan terang di latar gelap
  let o = g;
  if (amt > 0) { const b = boxBlur(g, w, h, rad(w, h)); o = new Uint8ClampedArray(n); for (let j = 0; j < n; j++) o[j] = g[j] + amt * (g[j] - b[j]); }
  return bin ? adaptiveBin(o, w, h) : o;
}
function enhanceRGBA(d, w, h, amt){         // versi berwarna: kontras + ketajaman pada kecerahan saja
  const n = w * h, g = new Uint8ClampedArray(n);
  for (let i = 0, j = 0; j < n; i += 4, j++) g[j] = (d[i] * 77 + d[i + 1] * 151 + d[i + 2] * 28) >> 8;
  const L = stretchLut(g);
  for (let i = 0, j = 0; j < n; i += 4, j++) { d[i] = L[d[i]]; d[i + 1] = L[d[i + 1]]; d[i + 2] = L[d[i + 2]]; g[j] = L[g[j]]; }
  if (amt > 0) { const b = boxBlur(g, w, h, rad(w, h)); for (let i = 0, j = 0; j < n; i += 4, j++) { const k = amt * (g[j] - b[j]); d[i] += k; d[i + 1] += k; d[i + 2] += k; } }
}
/*PURE-END*/

const MAX_WORK = 2400;                       // sisi terpanjang gambar kerja (untuk edit & baca teks)
const MAX_SEND = 1400, Q_SEND = 0.72;        // yang dikirim ke Firestore (sama seperti sebelumnya)
const canvasOf = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
function resize(src, long){
  const [w, h] = dims(src), k = long / Math.max(w, h);
  const c = canvasOf(Math.max(1, Math.round(w * k)), Math.max(1, Math.round(h * k))), x = c.getContext("2d", { willReadFrequently: true });
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);      // latar putih (PNG transparan tidak jadi hitam)
  x.imageSmoothingQuality = "high"; x.drawImage(src, 0, 0, c.width, c.height);
  return c;
}
const fitMax = (src, max) => resize(src, Math.min(max, Math.max(...dims(src))));
const fileToCanvas = async file => { const u = URL.createObjectURL(file); try { return fitMax(await loadImg(u), MAX_WORK); } finally { URL.revokeObjectURL(u); } };
const urlToCanvas = async url => fitMax(await loadImg(url), 4000);
function grayToCanvas(g, w, h, pad = 0){
  const c = canvasOf(w + 2 * pad, h + 2 * pad), x = c.getContext("2d");
  x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
  const im = x.createImageData(w, h), d = im.data;
  for (let i = 0, j = 0; j < g.length; i += 4, j++) { d[i] = d[i + 1] = d[i + 2] = g[j]; d[i + 3] = 255; }
  x.putImageData(im, pad, pad); return c;
}
function applyFilter(c, filter, amt){        // ubah kanvas di tempat
  if (filter !== "jelas" && filter !== "bw") return;
  const x = c.getContext("2d", { willReadFrequently: true }), w = c.width, h = c.height, im = x.getImageData(0, 0, w, h), d = im.data;
  if (filter === "jelas") enhanceRGBA(d, w, h, amt);
  else { const g = grayPipeline(d, w, h, amt, true); for (let i = 0, j = 0; j < g.length; i += 4, j++) d[i] = d[i + 1] = d[i + 2] = g[j]; }
  x.putImageData(im, 0, 0);
}
function packUrl(c, bw){                     // JPEG; untuk hitam-putih pilih PNG bila lebih kecil
  const j = c.toDataURL("image/jpeg", Q_SEND); if (!bw) return j;
  const p = c.toDataURL("image/png"); return p.length < j.length ? p : j;
}
function drawMarks(c, marks){                // kotak merah ikut tergambar di gambar yang dikirim
  if (!marks || !marks.length) return;
  const x = c.getContext("2d"), W = c.width, H = c.height, lw = Math.max(2, Math.round(Math.max(W, H) / 330)), multi = marks.length > 1;
  marks.forEach((m, i) => {
    const n = norm(m), px = n.x0 * W, py = n.y0 * H, pw = (n.x1 - n.x0) * W, ph = (n.y1 - n.y0) * H;
    x.fillStyle = "rgba(229,50,45,.10)"; x.fillRect(px, py, pw, ph);
    x.strokeStyle = "#e5322d"; x.lineWidth = lw; x.strokeRect(px + lw / 2, py + lw / 2, pw - lw, ph - lw);
    if (multi) { const s = lw * 6; x.fillStyle = "#e5322d"; x.fillRect(px, py, s, s); x.fillStyle = "#fff"; x.font = `700 ${Math.round(s * .75)}px sans-serif`; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(String(i + 1), px + s / 2, py + s / 2 + 1); }
  });
}
function renderFinal(base, filter, sharp, marks){
  const out = fitMax(base, MAX_SEND); applyFilter(out, filter, sharp / 100); drawMarks(out, marks); return packUrl(out, filter === "bw");
}

/* ---------- gambar masukan ---------- */
let pic = null;                              // { orig, work, filter, sharp, marks } -> work: hasil potong/putar (resolusi tinggi); marks: kotak merah (pecahan 0..1)

/* ---------- OCR ---------- */
// true = model bahasa "best" (lebih akurat untuk teks buram; unduhan pertama lebih besar, lalu tersimpan di cache browser)
const OCR_BEST_MODEL = true, LANG_PATH = "https://tessdata.projectnaptha.com/4.0.0_best";
let worker = null, ocrLabel = "", ocrBusy = false;
async function getWorker(){
  if (worker) return worker;
  const logger = m => {
    if (m.status === "recognizing text") status(ocrLabel + Math.round(m.progress * 100) + "%");
    else if (/loading/.test(m.status || "") && m.progress != null) status("Menyiapkan pembaca teks (pertama kali agak lama)… " + Math.round(m.progress * 100) + "%");
  };
  let w;
  if (OCR_BEST_MODEL) { try { w = await Tesseract.createWorker("ind+eng", 1, { langPath: LANG_PATH, logger }); } catch { w = null; } }
  if (!w) w = await Tesseract.createWorker("ind+eng", 1, { logger });
  try { await w.setParameters({ preserve_interword_spaces: "1", user_defined_dpi: "300" }); } catch {}
  return worker = w;

    }
    re.lastIndex = m.index + used.length; last = re.lastIndex;
  }
  put(text.slice(last));
}
const para = (lines, parent) => lines.forEach((ln, k) => { if (k) parent.append(mk("br")); inline(ln, parent); });
function codeBlock(code, lang){
  const w = mk("div", "cb"), bar = mk("div", "cbar"), l = mk("span"), b = mk("button");
  l.textContent = lang || "kode"; b.type = "button"; b.textContent = "Salin"; b.onclick = () => copy(code, b);
  bar.append(l, b);
  const pre = mk("pre"), c = mk("code"); c.textContent = code; pre.append(c); w.append(bar, pre); return w;
}
function buildList(items){
  const root = { kids: [], ind: -1 }, st = [root];
  items.forEach(it => { while (st.length > 1 && st[st.length - 1].ind >= it.ind) st.pop(); st[st.length - 1].kids.push(it); st.push(it); });
  const emit = kids => {                       // jenis daftar berganti (nomor <-> poin) = daftar baru
    const fr = document.createDocumentFragment(); let cur = null;
    kids.forEach(k => {
      if (!cur || cur.dataset.o !== String(k.ord)) { cur = mk(k.ord ? "ol" : "ul"); cur.dataset.o = k.ord; if (k.ord && k.num > 1) cur.start = k.num; fr.append(cur); }
      const li = mk("li"); para(k.text.split("\n"), li); if (k.kids.length) li.append(emit(k.kids)); cur.append(li);
    });
    return fr;
  };
  return emit(root.kids);
}
function mdRender(src){
  const root = mk("div", "md"), L = src.replace(/\r\n?/g, "\n").split("\n");
  const isHr = s => /^\s*([-*_])(\s*\1){2,}\s*$/.test(s);
  const isItem = s => /^\s*([-*+]|\d{1,3}[.)])\s+\S/.test(s) && !isHr(s);
  const isSep = s => s != null && s.includes("-") && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(s);
  const cells = r => r.trim().replace(/^\|/, "").replace(/\|$/, "").replace(/\\\|/g, "\u0001").split("|").map(c => c.replace(/\u0001/g, "|").trim());
  const starts = (s, nx) => /^\s*(```|~~~)/.test(s) || /^#{1,6}\s/.test(s) || isHr(s) || isItem(s) || /^\s*>/.test(s) || (s.includes("|") && isSep(nx));
  let i = 0;
  while (i < L.length) {
    const s = L[i]; let m;
    if (!s.trim()) { i++; continue; }
    if ((m = s.match(/^\s*(```|~~~)\s*([\w+#.-]*)/))) {
      const close = new RegExp("^\\s*" + m[1]), code = []; i++;
      while (i < L.length && !close.test(L[i])) code.push(L[i++]);
      i++; root.append(codeBlock(code.join("\n"), m[2])); continue;
    }
    if ((m = s.match(/^(#{1,6})\s+(.*?)\s*$/))) { const h = mk("h" + m[1].length); inline(m[2], h); root.append(h); i++; continue; }
    if (isHr(s)) { root.append(mk("hr")); i++; continue; }
    if (s.includes("|") && isSep(L[i + 1])) {
      const head = cells(s), rows = []; i += 2;
      while (i < L.length && L[i].trim() && L[i].includes("|")) rows.push(cells(L[i++]));
      const wr = mk("div", "tw"), t = mk("table"), th = mk("thead"), tb = mk("tbody"), hr = mk("tr");
      head.forEach(c => { const e = mk("th"); inline(c, e); hr.append(e); }); th.append(hr);
      rows.forEach(r => { const tr = mk("tr"); head.forEach((_, k) => { const e = mk("td"); inline(r[k] || "", e); tr.append(e); }); tb.append(tr); });
      t.append(th, tb); wr.append(t); root.append(wr); continue;
    }
    if (/^\s*>/.test(s)) {
      const q = []; while (i < L.length && /^\s*>/.test(L[i])) q.push(L[i++].replace(/^\s*>\s?/, ""));
      const b = mk("blockquote"); b.append(...mdRender(q.join("\n")).childNodes); root.append(b); continue;
    }
    if (isItem(s)) {
      const items = [];
      while (i < L.length) {
        const x = L[i];
        if (isItem(x)) { const mm = x.match(/^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/); items.push({ ind: mm[1].replace(/\t/g, "    ").length, ord: /\d/.test(mm[2]), num: parseInt(mm[2]), text: mm[3], kids: [] }); i++; }
        else if (x.trim() && /^\s+\S/.test(x) && !/^\s*(```|~~~)/.test(x)) { items[items.length - 1].text += "\n" + x.trim(); i++; }
        else if (!x.trim() && i + 1 < L.length && isItem(L[i + 1])) i++;
        else break;
      }
      root.append(buildList(items)); continue;
    }
    const p = []; while (i < L.length && L[i].trim() && !(p.length && starts(L[i], L[i + 1]))) p.push(L[i++]);
    const pe = mk("p"); para(p, pe); root.append(pe);
  }
  return root;
}
/*MD-END*/
const MD_HINT = /(^|\n)\s{0,3}(#{1,6}\s|```|~~~|>\s|[-*+]\s+\S|\d{1,3}[.)]\s+\S)|\*\*[^\n]+?\*\*|`[^`\n]+`|\[[^\]\n]+\]\(https?:|\|\s*:?-{3,}/;
const hasMd = t => MD_HINT.test(t);
const plainDiv = t => { const p = mk("div", "txt"); p.textContent = t; return p; };

/* ---------- ikon (SVG inline) ---------- */
const ICON = {
  copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6M14 11v6"/>',

  imgcopy: '<rect width="13" height="13" x="9" y="9" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/><circle cx="14" cy="13" r="1"/><path d="m21 18-2.5-2.5a1.4 1.4 0 0 0-2 0L12 20"/>',

  paste: '<path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/>',
  edit: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',

  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/>',
  reset: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  crop: '<path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/>',
  mark: '<rect x="4" y="5" width="16" height="14" rx="2"/>'
};
const ico = n => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n] + '</svg>';
document.querySelectorAll("[data-ico]").forEach(b => b.innerHTML = ico(b.dataset.ico));

/* ---------- tampilan pesan ---------- */
function flash(btn, ok = true){
  const o = btn.innerHTML; btn.innerHTML = btn.classList.contains("ib") ? ico(ok ? "check" : "x") : (ok ? "Tersalin" : "Gagal");
  setTimeout(() => btn.innerHTML = o, 1200);
}
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  flash(btn);
}
function loadImage(ref, n){
  if (imgCache.has(ref.id)) return imgCache.get(ref.id);
  const p = (async () => {
    for (let t = 0; t < 4; t++) {
      const s = await ref.collection("chunks").orderBy("i").get();
      if (s.size >= n) return s.docs.map(x => x.data().d).join("");
      await new Promise(r => setTimeout(r, 800));
    }
    throw new Error("chunk belum lengkap");
  })();
  imgCache.set(ref.id, p); p.catch(() => imgCache.delete(ref.id));
  return p;
}
function toPng(blob){
  return new Promise(r => { const i = new Image(); i.onload = () => { const c = document.createElement("canvas"); c.width = i.width; c.height = i.height; c.getContext("2d").drawImage(i, 0, 0); c.toBlob(r, "image/png"); }; i.src = URL.createObjectURL(blob); });
}
const whenText = d => d.createdAt ? d.createdAt.toDate().toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "mengirim…";
function buildMsg(doc, d){
  const el = document.createElement("article"); el.className = "msg " + d.type;
  const meta = document.createElement("div"); meta.className = "meta";
  const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = d.type === "answer" ? "Jawaban" : "Prompt";
  const who = document.createElement("span"); who.append((d.device || "") + " "); const when = document.createElement("span"); when.className = "when"; when.textContent = whenText(d); who.append(when);
  const acts = document.createElement("span"); acts.className = "acts";
  meta.append(tag, who, acts); el.append(meta);
  const add = (icon, label, fn, cls = "") => {
    const b = document.createElement("button"); b.type = "button"; b.className = "ib " + cls; b.innerHTML = ico(icon);
    b.title = label; b.setAttribute("aria-label", label); b.onclick = () => fn(b); acts.append(b); return b;
  };
  const rich = !!d.text && hasMd(d.text);
  let body = null;
  if (d.text) { body = rich ? mdRender(d.text) : plainDiv(d.text); el.append(body); }
  const n = d.imgChunks || 0;
  if (n) {
    const i = document.createElement("img"); i.className = "pic loading"; i.alt = "";
    i.onclick = () => i.classList.toggle("big");
    el.append(i);
    loadImage(doc.ref, n).then(u => { i.src = u; i.alt = "Gambar terlampir"; i.classList.remove("loading"); })
      .catch(() => { const e = document.createElement("div"); e.className = "txt"; e.textContent = "Gambar gagal dimuat."; i.replaceWith(e); });
  }
  if (d.text) add("copy", "Salin teks", b => copy(d.text, b));
  if (rich) { let raw = false; add("raw", "Teks mentah / tampilan rapi", b => { raw = !raw; const nb = raw ? plainDiv(d.text) : mdRender(d.text); body.replaceWith(nb); body = nb; b.classList.toggle("on", raw); }); }
  if (n) {
    add("imgcopy", "Salin gambar", async b => {
      try { const u = await loadImage(doc.ref, n); const blob = await (await fetch(u)).blob(); await navigator.clipboard.write([new ClipboardItem({ "image/png": await toPng(blob) })]); flash(b); }
      catch { flash(b, false); status("Gambar tidak bisa disalin otomatis. Tahan gambar untuk menyalin."); }
    });
    add("scan", "Baca teks dari gambar", async b => { const r = await runOCR(await loadImage(doc.ref, n), b); if (r.text) { await copy(r.text, b); status("Teks hasil OCR sudah disalin." + hint(r.conf)); } else if (!$("st").textContent) status("Tidak ada teks terbaca."); });
  }
  add("trash", "Hapus pesan", async () => {
    if (!confirm("Hapus pesan ini?")) return;
    try { const cs = await doc.ref.collection("chunks").get(); await commitDeletes([...cs.docs.map(x => x.ref), doc.ref]); }
    catch (e) { status("Gagal menghapus: " + e.message); }
  }, "del");
  return el;
}

/* ---------- tata letak: kolom kiri dulu, penuh baru ke kolom kanan (hanya kanan yang di-scroll) ---------- */
let msgOrder = [], laySched = 0;
const ro = typeof ResizeObserver === "function" ? new ResizeObserver(() => layoutSoon()) : null;
const wide = () => matchMedia("(min-width:760px)").matches;
function layoutSoon(){ if (!laySched) laySched = requestAnimationFrame(() => { laySched = 0; layoutMsgs(); }); }
function clearList(){
  msgOrder = []; $("colL").replaceChildren(); $("colR").replaceChildren();
  if (ro) { ro.disconnect(); ro.observe($("list")); }
}
function layoutMsgs(){
  const L = $("colL"), R = $("colR"), set = new Set(msgOrder), n = msgOrder.length;
  [L, R].forEach(c => [...c.children].forEach(el => { if (!set.has(el)) el.remove(); }));
  msgOrder.forEach(el => { if (el.parentNode !== L && el.parentNode !== R) L.append(el); });     // semua harus ada di DOM agar bisa diukur
  let split = n;
  if (wide() && n > 1) {
    const H = L.clientHeight, gap = parseFloat(getComputedStyle(L).rowGap) || 0; let used = 0; split = 0;
    for (let i = 0; i < n; i++) {
      const h = msgOrder[i].offsetHeight + (i ? gap : 0);
      if (i > 0 && used + h > H) break;
      used += h; split = i + 1;
    }
    L.classList.toggle("sc", split === 1 && msgOrder[0].offsetHeight > H);   // satu pesan lebih tinggi dari kolom: boleh di-scroll
  } else L.classList.remove("sc");
  msgOrder.forEach((el, i) => {
    const col = i < split ? L : R, ref = col.children[i < split ? i : i - split];
    if (ref !== el) col.insertBefore(el, ref || null);
  });
}
window.addEventListener("resize", layoutSoon);
function render(snap){
  const ids = new Set(snap.docs.map(d => d.id));
  els.forEach((el, id) => { if (!ids.has(id)) { el.remove(); els.delete(id); } });
  $("empty").hidden = !snap.empty; $("list").hidden = snap.empty;
  msgOrder = snap.docs.map((doc, i) => {
    const d = doc.data({ serverTimestamps: "estimate" });
    let el = els.get(doc.id);
    if (!el) { el = buildMsg(doc, d); el.style.animationDelay = Math.min(i, 8) * 45 + "ms"; els.set(doc.id, el); ro && ro.observe(el); }
    else el.querySelector(".when").textContent = whenText(d);
    return el;
  });
  layoutMsgs();
}
