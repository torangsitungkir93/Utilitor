<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utilitor</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Utilitor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#081519">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"samudra"}catch(e){document.documentElement.dataset.theme="samudra"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.2,.8,.2,1);--serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
html[data-theme=samudra]{--bg:#081519;--bg2:#0e2229;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.1);--ink:#e9f2f3;--mute:#8da9b0;--line:rgba(255,255,255,.12);--p:#5fd0cb;--p-bg:rgba(95,208,203,.14);--a:#f0b866;--a-bg:rgba(240,184,102,.15);--danger:#ff8a80;--on:#06161a;--orb:.34;--shadow:0 12px 40px rgba(0,0,0,.35);color-scheme:dark}
html[data-theme=gading]{--bg:#f4eee2;--bg2:#fbf8f2;--card:rgba(255,255,255,.72);--card2:#fff;--ink:#1c2b2f;--mute:#667a80;--line:rgba(28,43,47,.13);--p:#0e6b6b;--p-bg:rgba(14,107,107,.1);--a:#a8620f;--a-bg:rgba(168,98,15,.11);--danger:#b3261e;--on:#fff;--orb:.17;--shadow:0 12px 32px rgba(60,50,30,.13);color-scheme:light}
html[data-theme=senja]{--bg:#120e1c;--bg2:#1c1632;--card:rgba(255,255,255,.055);--card2:rgba(255,255,255,.1);--ink:#f0ebf8;--mute:#a699bf;--line:rgba(255,255,255,.12);--p:#b79cff;--p-bg:rgba(183,156,255,.15);--a:#ffb878;--a-bg:rgba(255,184,120,.15);--danger:#ff8fa3;--on:#140d24;--orb:.34;--shadow:0 12px 40px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
small{color:var(--mute);font-weight:400}

/* latar bergerak */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,var(--bg2),var(--bg))}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--orb);will-change:transform}
.o1{width:46vmax;height:46vmax;background:var(--p);top:-18vmax;left:-12vmax;animation:d1 28s ease-in-out infinite alternate}
.o2{width:40vmax;height:40vmax;background:var(--a);bottom:-16vmax;right:-10vmax;opacity:calc(var(--orb)*.65);animation:d2 34s ease-in-out infinite alternate}
.o3{width:28vmax;height:28vmax;background:var(--p);top:35%;right:18%;opacity:calc(var(--orb)*.4);animation:d3 40s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vw,-12vh) scale(1.2)}}
@keyframes d3{to{transform:translate(-22vw,10vh) scale(.8)}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes fade{from{opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes sheen{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}

/* tombol & input */
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 13px;transition:background .2s,transform .2s var(--ease),border-color .2s,box-shadow .2s}
button:hover{background:var(--card2);transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.98)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--p);outline-offset:2px}
button:disabled{opacity:.55;cursor:wait;transform:none}
button.main{position:relative;overflow:hidden;border:0;font-weight:600;color:var(--on);background:var(--p);background:linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 55%,var(--a)));box-shadow:0 6px 22px -6px var(--p)}
button.main:hover{box-shadow:0 10px 28px -6px var(--p)}
button.main::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite}
button.icon{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px}
.del{color:var(--danger)}
input,textarea{font:inherit;width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 4px var(--p-bg);outline:0}
textarea{min-height:104px;resize:vertical}
::placeholder{color:var(--mute)}

/* splash & login */
#splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;transition:opacity .45s}
#splash.off{opacity:0;pointer-events:none}
.ring{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--p);animation:spin .8s linear infinite}
#login{min-height:100dvh;display:grid;place-items:center;padding:20px}
.lcard{width:min(380px,100%);display:grid;gap:12px;padding:30px 26px;border:1px solid var(--line);border-radius:24px;background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:var(--shadow);animation:rise .7s var(--ease) backwards}
.lcard>*{animation:rise .7s var(--ease) backwards}
.lcard>:nth-child(2){animation-delay:.08s}.lcard>:nth-child(3){animation-delay:.14s}.lcard>:nth-child(4){animation-delay:.2s}.lcard>:nth-child(5){animation-delay:.26s}.lcard>:nth-child(6){animation-delay:.32s}
.logo{width:64px;height:64px;border-radius:18px;margin:0 auto;display:block;animation:float 5s ease-in-out infinite;box-shadow:0 10px 30px -8px var(--p)}
.lcard h1{text-align:center;font-size:30px}
.lcard p{margin:0;text-align:center;color:var(--mute);font-size:14px}
#lerr{color:var(--danger);font-size:14px;text-align:center;min-height:20px}
.themes{display:flex;gap:8px;justify-content:center;align-items:center}
.themes button{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--line)}
.themes button.on{border-color:var(--ink);transform:scale(1.15)}
.themes [data-th=samudra]{background:linear-gradient(135deg,#0e2229 50%,#5fd0cb 50%)}
.themes [data-th=gading]{background:linear-gradient(135deg,#f4eee2 50%,#0e6b6b 50%)}
.themes [data-th=senja]{background:linear-gradient(135deg,#1c1632 50%,#b79cff 50%)}

/* aplikasi */
#app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100dvh;animation:fade .6s}
#side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:14px;padding:18px 14px;border-right:1px solid var(--line);background:var(--card);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:34px;height:34px;border-radius:10px}
.brand h1{font-size:21px;line-height:1.1}
#chats{flex:1;overflow:auto;display:grid;gap:4px;align-content:start;margin:0 -4px;padding:0 4px}
.citem{display:grid;gap:1px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid transparent;background:transparent}
.citem:hover{background:var(--card2);transform:none}
.citem.on{background:var(--p-bg);box-shadow:inset 3px 0 0 var(--p)}
.ct{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfoot{display:grid;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
#scrim{display:none}
#chatview{min-width:0}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:linear-gradient(var(--bg),transparent)}
header h2{flex:1;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu{display:none}
main{max-width:780px;margin:auto;padding:4px 18px 48px}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;display:grid;gap:12px;box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:border-color .25s,box-shadow .25s}
.box.drag{border-color:var(--p);box-shadow:0 0 0 4px var(--p-bg),var(--shadow)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.seg{display:flex;gap:0}
.seg button{border-radius:0}.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0;border-left:0}
.seg .on[data-t=prompt]{background:var(--p);color:var(--on);border-color:var(--p)}
.seg .on[data-t=answer]{background:var(--a);color:var(--on);border-color:var(--a)}
#prev{max-width:100%;max-height:220px;border-radius:12px;display:none;animation:rise .4s var(--ease)}
#st{color:var(--mute);font-size:14px;min-height:20px}
.msg{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;gap:10px;position:relative;overflow:hidden;animation:rise .55s var(--ease) backwards;transition:transform .25s var(--ease),border-color .25s,box-shadow .25s}
.msg::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--p)}
.msg.answer::before{background:var(--a)}
.msg:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.tag{padding:2px 10px;border-radius:99px;font-weight:600;background:var(--p-bg);color:var(--p)}
.answer .tag{background:var(--a-bg);color:var(--a)}
.txt{white-space:pre-wrap;word-break:break-word}
.pic{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.pic.loading{display:block;width:100%;height:160px;border:0;background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.msg .row button{padding:6px 11px;font-size:14px}
.empty{text-align:center;color:var(--mute);margin-top:56px;animation:fade .8s}

@media(max-width:820px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;z-index:30;inset:0 auto 0 0;width:min(84vw,310px);background:var(--bg2);transform:translateX(-104%);transition:transform .38s var(--ease);box-shadow:var(--shadow)}
  #app.open #side{transform:none}
  #scrim{display:block;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
  #app.open #scrim{opacity:1;pointer-events:auto}
  #menu{display:grid}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<div id="splash"><div class="ring"></div></div>

<section id="login" hidden>
  <div class="lcard">
    <img class="logo" src="favicon.svg" alt="">
    <h1>Utilitor</h1>
    <p>Pertukaran data antar perangkat, pribadi dan rapi.</p>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password">
    <button class="main" id="go">Masuk</button>
    <div id="lerr" role="alert"></div>
    <div class="themes" role="group" aria-label="Tema"><button data-th="samudra" aria-label="Tema Samudra"></button><button data-th="gading" aria-label="Tema Gading"></button><button data-th="senja" aria-label="Tema Senja"></button></div>
    <p><small class="ver"></small></p>
  </div>
</section>

<div id="app" hidden>
  <aside id="side">
    <div class="brand"><img src="favicon.svg" alt=""><h1>Utilitor <small class="ver"></small></h1></div>
    <button class="main" id="newchat">＋ Chat baru</button>
    <nav id="chats" aria-label="Daftar chat"></nav>
    <div class="sfoot">
      <div class="themes" role="group" aria-label="Tema"><button data-th="samudra" aria-label="Tema Samudra"></button><button data-th="gading" aria-label="Tema Gading"></button><button data-th="senja" aria-label="Tema Senja"></button></div>
      <button id="out">Keluar</button>
    </div>
  </aside>
  <div id="scrim"></div>
  <div id="chatview">
    <header>
      <button class="icon" id="menu" aria-label="Buka daftar chat">☰</button>
      <h2 id="ctitle">…</h2>
      <button class="icon" id="ren" aria-label="Ganti nama chat" title="Ganti nama">✎</button>
      <button class="icon del" id="delchat" aria-label="Hapus chat" title="Hapus chat">✕</button>
    </header>
    <main>
      <div class="box" id="drop">
        <div class="row">
          <div class="seg"><button data-t="prompt" class="on">Prompt</button><button data-t="answer">Jawaban</button></div>
          <span class="sp"></span>
          <button type="button" id="pick">Foto / gambar</button>
          <input id="file" type="file" accept="image/*" hidden>
        </div>
        <textarea id="txt" placeholder="Tulis atau tempel teks. Di PC, Ctrl+V menempel screenshot. Ctrl+Enter untuk kirim."></textarea>
        <img id="prev" alt="Pratinjau gambar">
        <div class="row">
          <button id="ocr" hidden>Baca teks dari gambar</button>
          <button id="rm" hidden>Hapus gambar</button>
          <span class="sp"></span>
          <button class="main" id="send">Kirim</button>
        </div>
        <div id="st" role="status"></div>
      </div>
      <div id="list"></div>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyC0MVr263bQtDWNEPqBFraeJAcfqexQE5s",
  authDomain: "my-utilitor.firebaseapp.com",
  projectId: "my-utilitor",
  storageBucket: "my-utilitor.firebasestorage.app",
  messagingSenderId: "341792978678",
  appId: "1:341792978678:web:8a2503b7cd64e1a445ded7"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(), db = firebase.firestore();
const TS = firebase.firestore.FieldValue.serverTimestamp;
const $ = id => document.getElementById(id);
const device = /iPhone|iPad|Android/i.test(navigator.userAgent) ? "📱" : "💻";
const CHUNK = 180000;                 // karakter base64 per potongan (batas dokumen Firestore 1 MB)
const DEFAULT_TITLE = "Chat baru";
const store = { get(k){ try{ return localStorage.getItem(k) }catch{ return null } }, set(k,v){ try{ localStorage.setItem(k,v) }catch{} } };
let type = "prompt", img = null, chatId = null, chats = [], creating = false, chatsUnsub = null, msgsUnsub = null;
const els = new Map(), imgCache = new Map();
const status = m => $("st").textContent = m || "";

/* ---------- tema ---------- */
const THEMES = { samudra: "#081519", gading: "#f4eee2", senja: "#120e1c" };
function setTheme(t){
  if (!THEMES[t]) t = "samudra";
  document.documentElement.dataset.theme = t;
  document.querySelector("meta[name=theme-color]").content = THEMES[t];
  store.set("theme", t);
  document.querySelectorAll(".themes button").forEach(b => b.classList.toggle("on", b.dataset.th === t));
}
document.querySelectorAll(".themes button").forEach(b => b.onclick = () => setTheme(b.dataset.th));
setTheme(document.documentElement.dataset.theme);

fetch("version.json", { cache: "no-store" }).then(r => r.json()).then(v => document.querySelectorAll(".ver").forEach(e => e.textContent = "v" + v.version)).catch(() => {});

/* ---------- login ---------- */
auth.onAuthStateChanged(u => {
  $("splash").classList.add("off");
  $("login").hidden = !!u; $("app").hidden = !u;
  chatsUnsub && chatsUnsub(); msgsUnsub && msgsUnsub(); chatsUnsub = msgsUnsub = null;
  els.forEach(e => e.remove()); els.clear(); imgCache.clear();
  chatId = null; chats = [];
  if (u) { $("pw").value = ""; $("lerr").textContent = ""; startChats(); }
});
async function login(){
  const em = $("em").value.trim(), pw = $("pw").value;
  if (!em || !pw) return $("lerr").textContent = "Isi email dan kata sandi.";
  $("lerr").textContent = ""; $("go").disabled = true;
  try { await auth.signInWithEmailAndPassword(em, pw); }
  catch (e) { $("lerr").textContent = e.code === "auth/too-many-requests" ? "Terlalu banyak percobaan. Coba lagi nanti." : "Email atau kata sandi salah."; }
  $("go").disabled = false;
}
$("go").onclick = login;
[$("em"), $("pw")].forEach(i => i.addEventListener("keydown", e => e.key === "Enter" && login()));
$("out").onclick = () => auth.signOut();

/* ---------- daftar chat ---------- */
function startChats(){
  chatsUnsub = db.collection("chats").orderBy("updatedAt", "desc").onSnapshot(async snap => {
    chats = snap.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: "estimate" }) }));
    if (!chats.length) { if (!creating) await newChat(); return; }
    if (!chats.some(c => c.id === chatId)) {
      const saved = store.get("chat");
      selectChat(chats.some(c => c.id === saved) ? saved : chats[0].id);
    }
    renderChats();
  }, e => status("Gagal memuat chat: " + e.message));
}
function renderChats(){
  const nav = $("chats"); nav.innerHTML = "";
  chats.forEach(c => {
    const b = document.createElement("button");
    b.className = "citem" + (c.id === chatId ? " on" : "");
    const t = document.createElement("span"); t.className = "ct"; t.textContent = c.title || "Chat";
    const p = document.createElement("span"); p.className = "cp"; p.textContent = c.last || "Belum ada pesan";
    b.append(t, p); b.onclick = () => selectChat(c.id); nav.append(b);
  });
  const cur = chats.find(c => c.id === chatId);
  $("ctitle").textContent = cur ? cur.title : "…";
}
function selectChat(id){
  if (id === chatId) return;
  chatId = id; store.set("chat", id);
  msgsUnsub && msgsUnsub();
  els.forEach(e => e.remove()); els.clear(); imgCache.clear();
  $("list").innerHTML = ""; status("");
  msgsUnsub = db.collection("chats").doc(id).collection("messages").orderBy("createdAt", "desc").limit(100)
    .onSnapshot(render, e => status("Gagal memuat pesan: " + e.message));
  renderChats(); closeSide();
}
async function newChat(){
  creating = true;
  try {
    const ref = await db.collection("chats").add({ title: DEFAULT_TITLE, last: "", createdAt: TS(), updatedAt: TS() });
    selectChat(ref.id);
  } catch (e) { status("Gagal membuat chat: " + e.message); }
  creating = false;
}
$("newchat").onclick = newChat;
$("ren").onclick = async () => {
  const cur = chats.find(c => c.id === chatId); if (!cur) return;
  const t = prompt("Nama chat:", cur.title);
  if (t && t.trim()) db.collection("chats").doc(chatId).update({ title: t.trim().slice(0, 60) }).catch(e => status("Gagal: " + e.message));
};
async function commitDeletes(refs){
  for (let i = 0; i < refs.length; i += 400) { const b = db.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
}
$("delchat").onclick = async () => {
  const cur = chats.find(c => c.id === chatId); if (!cur) return;
  if (!confirm(`Hapus chat "${cur.title}" beserta semua pesannya?`)) return;
  status("Menghapus chat…");
  try {
    const chat = db.collection("chats").doc(chatId), refs = [];
    for (const m of (await chat.collection("messages").get()).docs) {
      (await m.ref.collection("chunks").get()).forEach(c => refs.push(c.ref)); refs.push(m.ref);
    }
    refs.push(chat); await commitDeletes(refs); status("Chat dihapus.");
  } catch (e) { status("Gagal menghapus: " + e.message); }
};
const closeSide = () => $("app").classList.remove("open");
$("menu").onclick = () => $("app").classList.add("open");
$("scrim").onclick = closeSide;

/* ---------- gambar ---------- */
document.querySelectorAll(".seg [data-t]").forEach(b => b.onclick = () => {
  type = b.dataset.t;
  document.querySelectorAll(".seg [data-t]").forEach(x => x.classList.toggle("on", x === b));
});
function compress(file, max = 1400, q = 0.72){
  return new Promise((res, rej) => {
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement("canvas");
      c.width = im.width * s; c.height = im.height * s;
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    im.onerror = rej; im.src = url;
  });
}
async function setImage(file){
  status("Memproses gambar…");
  try { img = await compress(file); } catch { return status("Gambar tidak bisa dibaca."); }
  $("prev").src = img; $("prev").style.display = "block";
  $("ocr").hidden = $("rm").hidden = false; status("");
}
function clearImage(){ img = null; $("prev").style.display = "none"; $("ocr").hidden = $("rm").hidden = true; $("file").value = ""; }
$("pick").onclick = () => $("file").click();
$("file").onchange = e => e.target.files[0] && setImage(e.target.files[0]);
$("rm").onclick = clearImage;
document.addEventListener("paste", e => {
  if ($("app").hidden) return;
  const f = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith("image/"));
  if (f) { e.preventDefault(); setImage(f); }
});
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
drop.addEventListener("drop", e => { const f = [...e.dataTransfer.files].find(f => f.type.startsWith("image/")); if (f) setImage(f); });

/* ---------- OCR ---------- */
async function runOCR(src, btn){
  btn.disabled = true;
  try {
    const r = await Tesseract.recognize(src, "ind+eng", { logger: m => m.status === "recognizing text" && status("Membaca teks… " + Math.round(m.progress * 100) + "%") });
    status(""); return r.data.text.trim();
  } catch { status("OCR gagal. Coba gambar yang lebih jelas."); return ""; }
  finally { btn.disabled = false; }
}
$("ocr").onclick = async () => {
  const t = await runOCR(img, $("ocr"));
  if (t) { $("txt").value = ($("txt").value ? $("txt").value + "\n\n" : "") + t; status("Teks dari gambar sudah ditambahkan. Silakan periksa dulu."); }
  else if (!$("st").textContent) status("Tidak ada teks terbaca.");
};

/* ---------- kirim: gambar dipotong jadi chunks ---------- */
$("send").onclick = async () => {
  const text = $("txt").value.trim();
  if (!chatId) return status("Chat belum siap.");
  if (!text && !img) return status("Isi teks atau tambahkan gambar dulu.");
  $("send").disabled = true;
  try {
    const chat = db.collection("chats").doc(chatId), mref = chat.collection("messages").doc(), b = db.batch();
    let n = 0;
    if (img) {
      for (let i = 0; i < img.length; i += CHUNK, n++)
        b.set(mref.collection("chunks").doc(String(n).padStart(4, "0")), { i: n, d: img.slice(i, i + CHUNK) });
      imgCache.set(mref.id, Promise.resolve(img));
    }
    b.set(mref, { text, type, device, imgChunks: n, imgSize: img ? img.length : 0, createdAt: TS() });
    const cur = chats.find(c => c.id === chatId);
    const upd = { updatedAt: TS(), last: (text || "🖼 Gambar").replace(/\s+/g, " ").slice(0, 80) };
    if (!cur || cur.title === DEFAULT_TITLE) upd.title = (text || "Gambar").replace(/\s+/g, " ").slice(0, 32);
    b.update(chat, upd);
    await b.commit();
    $("txt").value = ""; clearImage(); status("Terkirim.");
  } catch (e) { status("Gagal kirim: " + e.message); }
  $("send").disabled = false;
};
$("txt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("send").click(); } });

/* ---------- tampilan pesan ---------- */
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  const o = btn.textContent; btn.textContent = "Tersalin"; setTimeout(() => btn.textContent = o, 1200);
}
function loadImage(ref, n){
  if (imgCache.has(ref.id)) return imgCache.get(ref.id);
  const p = (async () => {
    for (let t = 0; t < 4; t++) {
      const s = await ref.collection("chunks").orderBy("i").get();
      if (s.size >= n) return s.docs.map(x => x.data().d).join("");
      await new Promise(r => setTimeout(r, 800));
    }
    throw new Error("chunk belum lengkap");
  })();
  imgCache.set(ref.id, p); p.catch(() => imgCache.delete(ref.id));
  return p;
}
function toPng(blob){
  return new Promise(r => { const i = new Image(); i.onload = () => { const c = document.createElement("canvas"); c.width = i.width; c.height = i.height; c.getContext("2d").drawImage(i, 0, 0); c.toBlob(r, "image/png"); }; i.src = URL.createObjectURL(blob); });
}
const whenText = d => d.createdAt ? d.createdAt.toDate().toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "mengirim…";
function buildMsg(doc, d){
  const el = document.createElement("article"); el.className = "msg " + d.type;
  el.innerHTML = `<div class="meta"><span class="tag">${d.type === "answer" ? "Jawaban" : "Prompt"}</span><span>${d.device || ""} <span class="when"></span></span></div>`;
  el.querySelector(".when").textContent = whenText(d);
  if (d.text) { const p = document.createElement("div"); p.className = "txt"; p.textContent = d.text; el.append(p); }
  const n = d.imgChunks || 0;
  if (n) {
    const i = document.createElement("img"); i.className = "pic loading"; i.alt = "";
    el.append(i);
    loadImage(doc.ref, n).then(u => { i.src = u; i.alt = "Gambar terlampir"; i.classList.remove("loading"); })
      .catch(() => { const e = document.createElement("div"); e.className = "txt"; e.textContent = "Gambar gagal dimuat."; i.replaceWith(e); });
  }
  const row = document.createElement("div"); row.className = "row";
  const add = (label, fn, cls) => { const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = () => fn(b); row.append(b); };
  if (d.text) add("Salin teks", b => copy(d.text, b));
  if (n) {
    add("Salin gambar", async b => {
      try { const u = await loadImage(doc.ref, n); const blob = await (await fetch(u)).blob(); await navigator.clipboard.write([new ClipboardItem({ "image/png": await toPng(blob) })]); b.textContent = "Tersalin"; }
      catch { b.textContent = "Tahan gambar untuk menyalin"; }
    });
    add("Baca teks", async b => { const t = await runOCR(await loadImage(doc.ref, n), b); if (t) { await copy(t, b); status("Teks hasil OCR sudah disalin."); } });
  }
  add("Hapus", async () => {
    if (!confirm("Hapus pesan ini?")) return;
    try { const cs = await doc.ref.collection("chunks").get(); await commitDeletes([...cs.docs.map(x => x.ref), doc.ref]); }
    catch (e) { status("Gagal menghapus: " + e.message); }
  }, "del");
  el.append(row); return el;
}
function render(snap){
  const list = $("list"), ids = new Set(snap.docs.map(d => d.id));
  els.forEach((el, id) => { if (!ids.has(id)) { el.remove(); els.delete(id); } });
  const empty = list.querySelector(".empty");
  if (snap.empty) { if (!empty) list.innerHTML = '<p class="empty">Belum ada pesan di chat ini. Kirim yang pertama.</p>'; return; }
  empty && empty.remove();
  snap.docs.forEach((doc, i) => {
    const d = doc.data({ serverTimestamps: "estimate" });
    let el = els.get(doc.id);
    if (!el) { el = buildMsg(doc, d); el.style.animationDelay = Math.min(i, 8) * 45 + "ms"; els.set(doc.id, el); }
    else el.querySelector(".when").textContent = whenText(d);
    if (list.children[i] !== el) list.insertBefore(el, list.children[i] || null);
  });
}
</script>
